<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="신생아 가정의 '잘 잔 날' 24시간 고객 여정을 원형 시계로 보여주는 여정지도">
<title>잘 잔 날 여정 시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 왼쪽 정사각형 시계(자정이 위, 정오가 아래 · 바깥 고리는 시간대별 하늘색) + 오른쪽 상세 패널.
   행동은 시계 안에 짧은 키워드로 늘 보이고, 누르면 그 자리에서 글자가 커진다. 라이트 전용 */
:root{
  color-scheme:light;
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f3f4f8; --line:#dcdfe7;
  --fg:#171a23; --fg2:#4b5162; --fg3:#868c9c;
  --accent:#f0a020; --pain:#e5484d; --pain-bg:#fff1f0; --sel:#171a23;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;
  word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.app{height:100%;max-width:1600px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px}

/* 머리글 */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px}
.ttl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;min-width:0}
.day{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--fg);color:var(--surface);border-radius:6px;padding:2px 8px}
h1{font-size:clamp(20px,2.1vw,26px);font-weight:900;margin:0;letter-spacing:-.02em}
.persona{color:var(--fg2);font-size:13px;margin:0}
.btn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--fg3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.dark{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn:focus-visible,.lab:focus-visible,.hrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 무대 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,420px);gap:14px;min-height:0}
.boardwrap{min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:min(100cqw,100cqh);aspect-ratio:1/1;container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:24px}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#svg text{font-family:var(--font)}
.hit{cursor:pointer}

/* 시계 위 행동 라벨 (HTML 버튼으로 얹음) */
.lab{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);
  font:inherit;font-size:clamp(9px,1.5cqw,16px);font-weight:700;line-height:1.18;letter-spacing:-.01em;color:var(--fg);
  text-align:center;background:transparent;border:0;border-radius:10px;padding:2px 3px;cursor:pointer;white-space:nowrap;
  transition:left .38s cubic-bezier(.2,.9,.25,1),top .38s cubic-bezier(.2,.9,.25,1),font-size .38s cubic-bezier(.2,.9,.25,1),opacity .25s,background-color .25s,box-shadow .25s;z-index:2}
.lab:hover{background:var(--surface2)}
.lab .t,.lab .f,.lab .w{display:none}
.lab.extra{display:none}
.board.has-sel .lab:not(.on){opacity:.28}
.lab.on{display:block;left:var(--x2);top:var(--y2);font-size:clamp(14px,2.2cqw,23px);background:var(--surface);
  box-shadow:0 6px 24px rgba(23,26,35,.18),0 0 0 2px var(--sel);padding:.5em .75em .6em;white-space:normal;width:max-content;max-width:min(20.5cqw,240px);z-index:6;text-align:left}
.lab.night{color:#ffffff}
.lab.night:hover{background:rgba(255,255,255,.14)}
.lab.night.on{color:var(--fg);background:var(--surface)}
.lab.on .k{display:none}
.lab.on .t{display:block;font-family:var(--mono);font-size:.62em;font-weight:600;color:var(--fg2);margin-bottom:.15em}
.lab.on .f{display:block;font-weight:900;line-height:1.25}
.lab.on .w{display:inline-block;font-size:.55em;font-weight:700;border-radius:999px;padding:.1em .6em;margin-top:.45em;color:var(--fg)}

/* 가운데 */
.center{position:absolute;left:50%;top:50%;width:22.5%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.25em}
.center .big{font-size:clamp(14px,2.5cqw,26px);font-weight:900;letter-spacing:-.02em;line-height:1.15}
.center .sm{font-size:clamp(9px,1.2cqw,13px);color:var(--fg2);line-height:1.35}
.center .em{font-size:clamp(20px,4.2cqw,44px);line-height:1}
.center .tm{font-family:var(--mono);font-weight:600;font-size:clamp(11px,1.7cqw,18px)}
.center .q{font-size:clamp(9px,1.28cqw,14px);line-height:1.4;color:var(--fg)}
.center .hint{font-size:clamp(9px,1.15cqw,12px);font-weight:700;color:var(--accent);margin-top:.2em}

/* 패널 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto}
.panel h2{font-size:20px;margin:0;font-weight:900;letter-spacing:-.01em}
.muted{color:var(--fg2);font-size:13px;margin:0}
.guide{display:grid;grid-template-columns:30px 1fr;gap:8px 10px;align-items:center;font-size:13px;color:var(--fg2);margin:0}
.guide svg{display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.lbl{font-size:11px;font-weight:700;color:var(--fg3);letter-spacing:.06em;margin-bottom:5px}
.phase{display:flex;flex-direction:column;gap:2px}
.phase h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;margin:6px 0 2px}
.phase h3 i{width:12px;height:12px;border-radius:3px;display:inline-block;outline:1px solid var(--line)}
.phase h3 span{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--fg3)}
.hrow{display:grid;grid-template-columns:44px minmax(0,1fr) 22px 10px;align-items:center;gap:8px;text-align:left;font:inherit;background:transparent;border:0;border-radius:8px;padding:5px 6px;cursor:pointer;color:var(--fg)}
.hrow:hover{background:var(--surface2)}
.hrow .tm{font-family:var(--mono);font-size:12px;color:var(--fg2)}
.hrow .nm{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .pd{width:8px;height:8px;border-radius:50%;background:var(--pain)}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phtag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 11px}
.hour{display:flex;flex-direction:column;gap:14px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hhead{display:flex;align-items:flex-start;gap:12px}
.hhead .tm{font-family:var(--mono);font-weight:600;font-size:28px;line-height:1.1}
.hhead .st{font-size:13px;color:var(--fg2);margin-top:2px}
.hhead .emo{margin-left:auto;text-align:center;font-size:12px;color:var(--fg2);font-weight:700}
.hhead .emo b{display:block;font-size:34px;line-height:1.1}
.who{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.title{font-weight:900;font-size:22px;line-height:1.3;margin:0;letter-spacing:-.01em;text-wrap:balance}
.desc{color:var(--fg);font-size:15px;line-height:1.75;margin:0}
.quote{font-size:15px;line-height:1.6;border-left:4px solid var(--emo-c);background:var(--surface2);border-radius:0 10px 10px 0;padding:10px 14px}
.quote small{display:block;font-size:11.5px;color:var(--fg3);font-weight:700;margin-bottom:2px}
.painbox{background:var(--pain-bg);color:#b3261e;font-size:14px;font-weight:500;line-height:1.6;padding:10px 14px;border-radius:10px;display:flex;gap:8px}
.painbox::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--pain);margin-top:.55em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 10px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.tag svg{flex:none}
.ins{display:flex;flex-direction:column;gap:8px}
.icard{border-radius:10px;padding:10px 14px;color:#2b2512}
.icard .k{font-size:11px;font-weight:700}
.icard .h{font-size:15px;font-weight:900;margin:1px 0}
.icard .b{font-size:13px;line-height:1.55;color:#3a3426}
.nav{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.nav .row{display:flex;align-items:center;gap:8px}
.nav .pos{font-family:var(--mono);font-size:12.5px;color:var(--fg2);margin-right:auto}
.progress{display:flex;gap:3px}
.progress i{flex:1;height:6px;border-radius:2px;display:block;opacity:.45}
.progress i.on{opacity:1;outline:2px solid var(--fg);outline-offset:1px}
.keys{font-size:11.5px;color:var(--fg3)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface2);color:var(--fg2)}

body.present header .persona{display:none}
@container (max-width:600px){.center .q,.center .hint,.center .ov{display:none}.lab.on{max-width:34cqw}}
@media (prefers-reduced-motion:reduce){.lab{transition:none}.hour{animation:none}}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  .stage{grid-template-columns:minmax(0,1fr)}
  .boardwrap{container-type:inline-size}
  .board{width:100%}
  .panel{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="ttl">
      <span class="day">DAY 1</span>
      <h1>잘 잔 날, 24시간</h1>
      <p class="persona">보호자 1명 이상 상시 재택(낮 엄마 / 밤 아빠 교대) · 아기 생후 1~2개월 · 루틴대로 입면하고 새벽 수유 후 바로 재입면</p>
    </div>
    <button class="btn dark" id="presentBtn" type="button">발표 모드</button>
  </header>
  <div class="stage">
    <div class="boardwrap">
      <section class="board" id="board" aria-label="잘 잔 날 24시간 여정 시계">
        <svg id="svg" viewBox="0 0 1000 1000" role="img" aria-label="자정이 위, 정오가 아래인 24시간 원형 여정지도"></svg>
        <div class="center" id="center" aria-hidden="true"></div>
      </section>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
/* ───────── 데이터 (잘 잔 날 여정지도 기준) ───────── */
const IC={A:['자동 기록','#a8dbff','#0b4f80'],W:['위급상황 감지','#c6ff8a','#2f6600'],I:['정보 · 육아 상식','#ffb3d1','#8a1d4e'],S:['수면 관리','#ffc58a','#7a3a00'],C:['커뮤니케이션','#ffe97a','#6b5800'],P:['깨어있을 때 · 놀이','#d2fdff','#0b5f6b'],N:['새로운 기능','#cdb6ff','#2e0f6b']};
const ACT={'엄마':'#fde2ec','아빠':'#e1ecfd','도우미':'#e0f2e9'};
const EMO=[['🙂','#2fa866','편안'],['😐','#c4b028','보통'],['😟','#f0883a','불안'],['😫','#e5484d','한계']];
// [시각, 상태, 주체(·로 여러 명), 행동 제목, 설명, 터치포인트, 페인포인트, 감정레벨, 감정주체, 감정문구, 인사이트, 시계 키워드, 아이콘]
const H=[
['09:00','🌅 안방 → 거실 이동','엄마·아빠','밤사이 기록 인계 · 거실로 이동','아빠에게 밤사이 기록을 넘겨받고 아기를 안방에서 거실로 옮긴다. 커튼을 열어 자연광으로 낮이 시작됐음을 알린다.','커튼|육아 앱|아기침대','',0,'엄마','“어제 잘 잔 덕에 나도 조금 쉬었어. 기분 좋게 시작!”',[['S','자연광 기상 유도','기상 시간에 맞춰 커튼·조명을 밝혀 자연광 신호로 일주기 리듬을 잡아준다'],['A','수면·깸 시간 자동 기록','아기가 눈 뜬 시각을 자동 기록해 하루 수면 패턴의 기준점을 잡는다']],'아침\n교대','curtain'],
['10:00','🍼 75ml','엄마','수유 후 트림 · 앱에 기록','75ml를 먹인 뒤 세워 안아 트림을 시킨다. 수유량과 기저귀 교체를 육아 앱에 하나씩 입력한다.','수유쿠션|젖병|육아 앱','수유량·기저귀 교체를 매번 손으로 입력해야 해서, 아기를 안은 채 기록하기 번거롭다',1,'엄마','“수유량 적고, 기저귀 적고… 입력할 게 많네”',[['A','수유·기저귀 자동 기록','수유 시작·종료와 기저귀 교체를 원터치 또는 센서로 자동 기록']],'수유·\n앱 기록','bottle'],
['11:00','👀 깨어 놀기 · 졸음 신호','엄마','초점책 놀이 · 낮잠 준비','흑백 초점책을 보여주며 시선을 따라가는지 본다. 눈을 비비기 시작하자 수유·수면 간격을 확인하고 낮잠을 준비한다.','흑백 초점책|육아 앱','',0,'엄마','“초점책 따라 눈이 움직여! 오늘 컨디션 좋다”',[['P','월령 맞춤 놀이 추천','깨어 있는 시간에 흑백 초점책·노래 등 1~2개월 맞춤 놀이를 추천'],['S','졸음 신호 · 낮잠 적기 알림','깨어 있던 시간과 하품·눈 비비기를 바탕으로 낮잠 재울 때를 알려준다']],'초점책\n놀이','book'],
['12:00','😴 낮잠 12:00–13:30','엄마','밝은 곳에서 낮잠 재우기','낮잠 시작 시간을 기록하고, 커튼을 열어둔 밝은 거실에서 재운다.','거실|커튼|육아 앱','',0,'엄마','“졸음 신호 딱 맞춰 눕혔더니 금방 잠들었어”',[['I','낮잠 환경 가이드','"낮잠은 밝게, 밤잠은 어둡게" — 낮밤 구분 수면 상식을 시간대별로 안내'],['P','깨어 있는 시간 타이머','깬 지 얼마나 됐는지 보여주고, 적정 시간에 가까워지면 잠들 준비로 넘어가도록 알려준다']],'밝은 데서\n낮잠','curtain'],
['13:00','😴 낮잠 중 · 13:30 기상','엄마','생활소음 유지 · 홈캠 확인','TV 소리 등 평소 소음을 그대로 두고, 홈캠으로 낮잠의 수면 상태를 확인한다. 깬 시간을 기록해 낮잠 시간을 파악한다.','TV|홈캠|육아 앱','',0,'엄마','“낮잠 타이머 맞춰 놓고 나도 눈 붙였어”',[['A','수면·깸 시간 자동 기록','입면·기상 시간을 자동으로 기록해 낮잠 길이를 계산']],'홈캠\n확인','cam'],
['14:00','🍼 75ml','엄마','수유 후 오늘 패턴 확인','수유·트림 후 수유량을 기록하고, 앱에서 오늘의 수유·수면 흐름을 훑어본다.','젖병|육아 앱','',0,'엄마','“기록이 쌓이니 패턴이 보여서 안심돼”',[['A','수유·수면 타임라인','하루 흐름을 한눈에 보여주고 다음 수유·낮잠 시점을 미리 알려준다']],'패턴\n확인','phone'],

/* ───────── 시계 기하: 자정이 위(0°), 시계 방향 ───────── */
const NS='http://www.w3.org/2000/svg', CX=500, CY=500;
const R={c:118,e3:150,e0:228,lab:292,lab2:230,pain0:334,pain1:342,s0:346,s1:392,num:369,ph0:398,ph1:424,ph:411,bub:455,bubR:18};
const lvR=l=>R.e0-l*((R.e0-R.e3)/3);
const ang=h=>h*15;
const pt=(r,a)=>{const t=a*Math.PI/180;return [CX+r*Math.sin(t),CY-r*Math.cos(t)]};
const f=n=>n.toFixed(1);
function band(r0,r1,a0,a1){const L=(a1-a0)>180?1:0,[x0,y0]=pt(r1,a0),[x1,y1]=pt(r1,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0);
  return `M${f(x0)} ${f(y0)}A${r1} ${r1} 0 ${L} 1 ${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}A${r0} ${r0} 0 ${L} 0 ${f(x3)} ${f(y3)}Z`}
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
const whoChips=(w,cls)=>w.split('·').map(n=>`<span class="${cls}" style="background:${ACT[n]||'#eceef2'}">${esc(n)}</span>`).join(' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 시간대별 하늘색 (낮 민트 → 노을 → 밤 남색 → 새벽)
const SKY=[[0,'#0b1670'],[3,'#13207a'],[4.5,'#2c3480'],[5.5,'#5c4c80'],[6.5,'#9a6a62'],[7.5,'#c4985a'],[8.5,'#bcc08e'],[9.5,'#a6e3cf'],[11,'#a3f1e3'],[13,'#a3f1e3'],[14.5,'#aee8d2'],[15.5,'#b9cf9e'],[16.5,'#c7a865'],[17.5,'#c4925a'],[18.5,'#9c6f62'],[19.5,'#6a5079'],[20.5,'#38357c'],[21.5,'#1a2275'],[24,'#0b1670']];
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function sky(h){h=((h%24)+24)%24;for(let i=0;i<SKY.length-1;i++){const[a,ca]=SKY[i],[b,cb]=SKY[i+1];if(h>=a&&h<=b){const t=(h-a)/(b-a),A=hex2(ca),B=hex2(cb);return A.map((v,k)=>Math.round(v+(B[k]-v)*t))}}return hex2(SKY[0][1])}
const rgb=a=>`rgb(${a.join(',')})`;
const lum=a=>(0.299*a[0]+0.587*a[1]+0.114*a[2])/255;

/* ───────── 그리기 ───────── */
const svg=document.getElementById('svg'), board=document.getElementById('board'), center=document.getElementById('center');
let SEL=-1;

function draw(){
  svg.innerHTML='';
  const g=el('g',{},svg);
  // 밤중 잦은 깸 구간: 안쪽 칸을 남색으로
  el('path',{d:band(R.c+2,R.s0,ang(NIGHT_S),ang(NIGHT_S+NIGHT_LEN)),fill:'#26325e'},g);
  // 시간 구분선
  for(let h=0;h<24;h++){const[a0,b0]=pt(R.c+6,ang(h)),[a1,b1]=pt(R.pain0-4,ang(h));el('line',{x1:f(a0),y1:f(b0),x2:f(a1),y2:f(b1),stroke:(inNight(h)&&h!==NIGHT_S)?'rgba(255,255,255,.14)':'#eceef3','stroke-width':1},g)}
  // 감정 단계 가이드
  for(let l=0;l<4;l++) el('circle',{cx:CX,cy:CY,r:lvR(l),fill:'none',stroke:'#e3e6ed','stroke-dasharray':'2 6'},g);
  // 선택 쐐기
  const selH=SEL<0?null:(H[SEL].h%24);
  if(selH!=null) el('path',{d:band(R.c,R.pain0-2,ang(selH),ang(selH+1)),fill:'#f0a020','fill-opacity':.12},g);
  // 하늘 고리
  for(let k=0;k<96;k++){const h0=k/4;el('path',{d:band(R.s0,R.s1,ang(h0)-.25,ang(h0+.25)+.25),fill:rgb(sky(h0+.125))},g)}
  for(let h=0;h<24;h++){const c=sky(h),[x,y]=pt(R.num,ang(h));
    el('text',{x:f(x),y:f(y+4.5),'text-anchor':'middle','font-size':h%6===0?15:13,'font-weight':h%6===0||h===9?700:500,fill:lum(c)<.55?'#ffffff':'#1f2433','font-family':'IBM Plex Mono, monospace'},g).textContent=h===12?'정오':h===0?'자정':h}
  // 페인포인트 (빨간 호)
  let runs=[];H.forEach(x=>{if(x.i<24&&x.pain){const h=x.h%24,last=runs[runs.length-1];if(last&&((last[1])%24)===h)last[1]=h+1+(h+1<last[0]?24:0);else runs.push([h,h+1])}});
  if(runs.length>1&&runs[0][0]===runs[runs.length-1][1]%24){const l=runs.pop();runs[0]=[l[0],runs[0][1]+(runs[0][1]<=l[0]?24:0)]}
  runs.forEach(([a,b])=>el('path',{d:band(R.pain0,R.pain1,ang(a)+.6,ang(b)-.6),fill:'#e5484d'},g));
  // 단계 띠 + 곡선 글자
  const defs=el('defs',{},svg);
  P.forEach((p,pi)=>{const a0=ang(p.s)+.5,a1=ang(p.s+p.len)-.5,mid=(a0+a1)/2,flip=(((mid%360)+360)%360)>90&&(((mid%360)+360)%360)<270;
    el('path',{d:band(R.ph0,R.ph1,a0,a1),fill:p.bg},g);
    const [x0,y0]=pt(R.ph,flip?a1:a0),[x1,y1]=pt(R.ph,flip?a0:a1),L=(a1-a0)>180?1:0;
    el('path',{id:'pp'+pi,d:`M${f(x0)} ${f(y0)}A${R.ph} ${R.ph} 0 ${L} ${flip?0:1} ${f(x1)} ${f(y1)}`,fill:'none'},defs);
    const t=el('text',{'font-size':13,'font-weight':700,fill:p.fg,dy:flip?9:4.5,'letter-spacing':'.02em'},g);
    const tp=el('textPath',{href:'#pp'+pi,startOffset:'50%','text-anchor':'middle'},t);tp.textContent=p.sh});
  if(selH!=null) el('path',{d:band(R.s0-1,R.ph1+1,ang(selH),ang(selH+1)),fill:'none',stroke:'#171a23','stroke-width':3,'stroke-linejoin':'round'},g);
  // 시작·끝 표시
  {const a=ang(9),[x0,y0]=pt(R.pain0-2,a),[x1,y1]=pt(R.ph1+6,a);el('line',{x1:f(x0),y1:f(y0),x2:f(x1),y2:f(y1),stroke:'#f0a020','stroke-width':3,'stroke-linecap':'round'},g);
   const[tx,ty]=pt(R.bub+52,a);
   el('text',{x:f(tx),y:f(ty),'text-anchor':'middle','font-size':16,'font-weight':900,fill:'#c27a00'},g).textContent='09:00 시작';
   el('text',{x:f(tx),y:f(ty+18),'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#868c9c'},g).textContent='시계 방향 ↻'}
  // 감정 곡선
  const pts=[];for(let h=0;h<24;h++){const x=H[(h-9+24)%24];pts.push(pt(lvR(x.lv),ang(h+.5)))}
  let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;const n=pts.length;
  for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`}
  // 선 색: 반지름(감정 단계)에 따라 초록(편안) → 빨강(한계)
  const rg=el('radialGradient',{id:'emoGrad',gradientUnits:'userSpaceOnUse',cx:CX,cy:CY,r:R.e0},defs);
  [3,2,1,0].forEach(l=>el('stop',{offset:(lvR(l)/R.e0).toFixed(3),'stop-color':EMO[l][1]},rg));
  el('path',{d:d+'Z',fill:'none',stroke:'#ffffff','stroke-width':14,'stroke-opacity':.9,'stroke-linejoin':'round'},g);
  el('path',{d:d+'Z',fill:'none',stroke:'url(#emoGrad)','stroke-width':8,'stroke-linejoin':'round'},g);
  for(let h=0;h<24;h++){const x=H[(h-9+24)%24],[px,py]=pts[h],on=selH===h,s=on?38:26;
    el('circle',{cx:f(px),cy:f(py),r:s*.62,fill:'#ffffff',stroke:EMO[x.lv][1],'stroke-width':on?3.5:2.5},g);
    el('text',{x:f(px),y:f(py+s*.36),'text-anchor':'middle','font-size':s},g).textContent=EMO[x.lv][0]}
  // 터치포인트·로봇 기능 동그라미
  for(let h=0;h<24;h++){const x=H[(h-9+24)%24],[bx,by]=pt(R.bub,ang(h+.5)),on=selH===h,r=on?R.bubR*1.45:R.bubR,ins=x.ins;
    const bg=el('g',{},g);
    if(ins.length>=2){el('path',{d:`M${f(bx)} ${f(by-r)}A${r} ${r} 0 0 0 ${f(bx)} ${f(by+r)}Z`,fill:IC[ins[0][0]][1]},bg);el('path',{d:`M${f(bx)} ${f(by-r)}A${r} ${r} 0 0 1 ${f(bx)} ${f(by+r)}Z`,fill:IC[ins[1][0]][1]},bg)}
    else el('circle',{cx:f(bx),cy:f(by),r,fill:ins.length?IC[ins[0][0]][1]:'#ffffff'},bg);
    el('circle',{cx:f(bx),cy:f(by),r,fill:'none',stroke:on?'#171a23':'#c9cdd8','stroke-width':on?2.5:1.2},bg);
    const s=r*1.05;const ig=el('g',{transform:`translate(${f(bx-s/2)} ${f(by-s/2)}) scale(${(s/24).toFixed(3)})`},bg);
    el('path',{d:ICO[x.ico],fill:'none',stroke:'#2a2f3c','stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round'},ig)}
  // 클릭 영역
  for(let h=0;h<24;h++){const idx=(h-9+24)%24;
    const hp=el('path',{d:band(R.c,R.bub+R.bubR+6,ang(h),ang(h+1)),fill:'transparent',class:'hit'},svg);
    hp.addEventListener('click',()=>go(idx===SEL?-1:idx))}
}

/* ───────── 행동 라벨 (HTML) ───────── */
const labs=H.map(x=>{
  const b=document.createElement('button');b.type='button';b.className='lab'+(x.i===24?' extra':'')+(x.i<24&&inNight(x.h%24)?' night':'');
  const a=x.i===24?ang(9):ang(x.h%24+.5);const[x1,y1]=pt(R.lab,a),[x2,y2]=pt(R.lab2,a);
  b.style.setProperty('--x',x1/10+'%');b.style.setProperty('--y',y1/10+'%');b.style.setProperty('--x2',x2/10+'%');b.style.setProperty('--y2',y2/10+'%');
  b.innerHTML=`<span class="k">${esc(x.kw).replace('\n','<br>')}</span><span class="t">${esc(x.t)}</span><span class="f">${esc(x.title)}</span>${whoChips(x.who,'w')}`;
  b.setAttribute('aria-label',`${x.t} ${x.title}`);
  b.addEventListener('click',()=>go(SEL===x.i?-1:x.i));
  board.appendChild(b);return b});

function drawCenter(){
  if(SEL<0){center.innerHTML=`<div class="big">잘 잔 날</div><div class="sm ov">19:50 입면 · 새벽 수유 4회<br>🙂 편안 ${H.filter(x=>x.i<24&&x.lv===0).length}번 · 😫 한계 ${H.filter(x=>x.i<24&&x.lv===3).length}번</div><div class="hint">시간을 눌러 보세요</div>`;return}
  const x=H[SEL],e=EMO[x.lv];
  center.innerHTML=`<div class="em">${e[0]}</div><div class="tm">${esc(x.t)}</div><div class="q">${esc(x.q)}</div><div class="sm">${esc(x.ew)} · ${e[2]}</div>`;
}

/* ───────── 패널 ───────── */
const panel=document.getElementById('panel');
const guideRow=(svgInner,txt)=>`<svg width="30" height="22" viewBox="0 0 30 22">${svgInner}</svg><span>${txt}</span>`;
function overviewPanel(){
  const skyStops=SKY.filter((_,i)=>i%2===0).map(([h,c])=>`<stop offset="${h/24}" stop-color="${c}"/>`).join('');
  panel.innerHTML=`<div><h2>하루의 흐름</h2><p class="muted">오른쪽 아래 09:00(아침 교대)에서 시작해 시계 방향으로 한 바퀴 돌면 다음 날 09:00 인계입니다. 시간이나 글자를 누르면 그 행동이 크게 보입니다.</p></div>
  <div class="guide">
    ${guideRow(`<defs><linearGradient id="gsk"><stop offset="0" stop-color="#a3f1e3"/><stop offset=".5" stop-color="#c4925a"/><stop offset="1" stop-color="#0b1670"/></linearGradient></defs><rect x="1" y="7" width="28" height="9" rx="2" fill="url(#gsk)"/>`,'바깥 고리는 하늘색입니다. 위쪽이 밤, 아래쪽이 낮이에요.')}
    ${guideRow(`<rect x="1" y="9" width="28" height="5" rx="2" fill="#e5484d"/>`,'빨간 선은 페인포인트가 있는 시간입니다.')}
    ${guideRow(`<defs><linearGradient id="gem"><stop offset="0" stop-color="${EMO[0][1]}"/><stop offset=".55" stop-color="${EMO[2][1]}"/><stop offset="1" stop-color="${EMO[3][1]}"/></linearGradient></defs><path d="M2 5C11 5 18 17 28 17" fill="none" stroke="url(#gem)" stroke-width="5" stroke-linecap="round"/>`,'감정 곡선은 바깥쪽·초록일수록 편안하고, 안쪽·빨강일수록 힘든 순간입니다.')}
    ${guideRow(`<rect x="1" y="3" width="28" height="16" rx="3" fill="#26325e"/>`,'남색 칸은 밤 시간(21~07시)입니다.')}
    ${guideRow(`<circle cx="15" cy="11" r="9.5" fill="#a8dbff" stroke="#c9cdd8"/><g transform="translate(7.5 3.5) scale(.62)"><path d="${ICO.bottle}" fill="none" stroke="#2a2f3c" stroke-width="1.8" stroke-linecap="round"/></g>`,'동그라미 그림은 터치포인트, 색은 리치미니 기능입니다.')}
  </div>
  <div><div class="lbl">리치미니 기능</div><div class="chips">${Object.values(IC).map(([n,c,fg])=>`<span class="chip" style="background:${c};color:${fg}">${n}</span>`).join('')}</div></div>
  <div>${P.map((p,pi)=>`<div class="phase"><h3><i style="background:${p.bg}"></i>${esc(p.n)} <span>${String(p.s).padStart(2,'0')}–${String((p.s+p.len)%24).padStart(2,'0')}시</span></h3>
    ${p.cols.map(c=>rowHTML(H[c])).join('')}</div>`).join('')}
    <div class="phase"><h3><i style="background:${PNEXT.bg}"></i>${PNEXT.n} <span>+1일 09시</span></h3>${rowHTML(H[24])}</div></div>
  ${navHTML()}`;
  panel.querySelectorAll('.hrow').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
  bindNav();
}
const rowHTML=x=>`<button class="hrow" type="button" data-i="${x.i}"><span class="tm">${esc(x.t.replace('+1일 ','+1 '))}</span><span class="nm">${esc(x.title)}</span><span>${EMO[x.lv][0]}</span>${x.pain?'<i class="pd" title="페인포인트"></i>':'<i></i>'}</button>`;
function navHTML(){
  return `<div class="nav"><div class="progress" aria-hidden="true">${H.map(x=>`<i class="${x.i===SEL?'on':''}" style="background:${phaseOf(x.i).bg}"></i>`).join('')}</div>
  <div class="row"><span class="pos">${SEL<0?'전체 보기':`${SEL+1} / ${H.length}`}</span><button class="btn" id="prevBtn" type="button" ${SEL<0?'disabled':''}>이전</button><button class="btn dark" id="nextBtn" type="button" ${SEL===H.length-1?'disabled':''}>${SEL<0?'09:00부터 보기':'다음'}</button></div>
  <div class="keys"><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>Esc</kbd> 전체 보기</div></div>`}
function bindNav(){const pv=document.getElementById('prevBtn'),nx=document.getElementById('nextBtn');pv&&pv.addEventListener('click',()=>go(SEL-1));nx&&nx.addEventListener('click',()=>go(SEL+1))}
function hourPanel(){
  const x=H[SEL],p=phaseOf(SEL),e=EMO[x.lv];
  panel.innerHTML=`<div class="top"><button class="btn" id="backBtn" type="button">전체 보기</button><span class="phtag" style="background:${p.bg};color:${p.fg}">${esc(p.n)}</span></div>
  <div class="hour">
    <div class="hhead"><div><div class="tm">${esc(x.t)}</div>${x.st?`<div class="st">${esc(x.st)}</div>`:''}</div><div class="emo"><b>${e[0]}</b>${e[2]}</div></div>
    <div>${whoChips(x.who,'who')}<h2 class="title">${esc(x.title)}</h2></div>
    <p class="desc">${esc(x.desc)}</p>
    <div class="quote" style="--emo-c:${e[1]}"><small>${esc(x.ew)}의 말</small>${esc(x.q)}</div>
    ${x.pain?`<div><div class="lbl">PAIN POINT</div><div class="painbox">${esc(x.pain)}</div></div>`:''}
    ${x.tp.length?`<div><div class="lbl">TOUCH POINT</div><div class="tags">${x.tp.map(t=>{const k=tpIcon(t);return `<span class="tag">${k?icoSVG(k,15):''}${esc(t)}</span>`}).join('')}</div></div>`:''}
    ${x.ins.length?`<div><div class="lbl">INSIGHT · 리치미니 기능</div><div class="ins">${x.ins.map(([k,t,b])=>`<div class="icard" style="background:${IC[k][1]}"><div class="k" style="color:${IC[k][2]}">${IC[k][0]}</div><div class="h">${esc(t)}</div><div class="b">${esc(b)}</div></div>`).join('')}</div></div>`:''}
  </div>
  ${navHTML()}`;
  document.getElementById('backBtn').addEventListener('click',()=>go(-1));
  bindNav();
}

/* ───────── 상태 전환 ───────── */
function go(i){
  i=Math.max(-1,Math.min(H.length-1,i));SEL=i;
  board.classList.toggle('has-sel',SEL>=0);
  labs.forEach((b,k)=>b.classList.toggle('on',k===SEL));
  draw();drawCenter();
  if(SEL<0)overviewPanel();else{hourPanel();panel.scrollTop=0}
}
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(SEL+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(SEL-1)}
  else if(e.key==='Escape'||e.key==='Home'){go(-1)}
});
document.getElementById('presentBtn').addEventListener('click',async()=>{
  const on=!document.body.classList.contains('present');document.body.classList.toggle('present',on);
  document.getElementById('presentBtn').textContent=on?'발표 모드 끄기':'발표 모드';
  try{if(on&&!document.fullscreenElement)await document.documentElement.requestFullscreen();else if(!on&&document.fullscreenElement)await document.exitFullscreen()}catch(err){}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('present')){document.body.classList.remove('present');document.getElementById('presentBtn').textContent='발표 모드'}});
go(-1);
</script>
</body>
</html>
